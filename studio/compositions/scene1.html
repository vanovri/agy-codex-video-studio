  <script>
    (function () {
      const canvas = document.getElementById("s1-wave-canvas");
      const ctx = canvas.getContext("2d");

      function drawOscilloscope(t) {
        const w = 900;
        const h = 460;
        ctx.clearRect(0, 0, w, h);

        // Grid lines
        ctx.strokeStyle = "rgba(244, 241, 234, 0.08)";
        ctx.lineWidth = 1;
        for (let x = 0; x <= w; x += 60) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h);
          ctx.stroke();
        }
        for (let y = 0; y <= h; y += 60) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }

        // Shutter split progress: starts at t=1.2s, completes across width by t=2.4s
        const wipeProgress = Math.max(0, Math.min(1, (t - 1.1) / 1.2));
        const splitX = Math.round(w * (1 - wipeProgress * 0.62)); // Leaves 38% raw on left, 62% clean on right

        const phase = t * 14.0;
        const midY = 250;

        // Draw RAW noisy 50Hz waveform on left of splitX
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, splitX, h);
        ctx.clip();
        ctx.strokeStyle = "#FF4D1C";
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        for (let x = 0; x <= splitX; x += 3) {
          const u = x / w;
          const hum50 = Math.sin(u * 38.0 + phase * 2.2) * 95;
          const harmonics = Math.sin(u * 114.0 - phase * 3.4) * 32;
          const burst = Math.sin(u * 180.0 + phase * 4.0) * 42 * Math.exp(-Math.pow((u - 0.25) / 0.14, 2));
          const y = midY + hum50 + harmonics + burst;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();

        // Draw CLEAN filtered Butterworth + Notch EMG waveform on right of splitX
        ctx.save();
        ctx.beginPath();
        ctx.rect(splitX, 0, w - splitX, h);
        ctx.clip();
        ctx.strokeStyle = "#10B981";
        ctx.lineWidth = 5;
        ctx.beginPath();
        for (let x = splitX; x <= w; x += 3) {
          const u = x / w;
          const env1 = Math.exp(-Math.pow((u - 0.55) / 0.09, 2));
          const env2 = Math.exp(-Math.pow((u - 0.82) / 0.08, 2));
          const motorUnit =
            (Math.sin(u * 190.0 + phase * 3.0) * 85 +
              Math.cos(u * 310.0 - phase * 4.5) * 48) *
            (env1 + 0.85 * env2);
          const residual = Math.sin(u * 38.0 + phase) * 4.5;
          const y = midY + motorUnit + residual;
          if (x === splitX) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();

        // Vertical shutter bar
        ctx.fillStyle = "#F4F1EA";
        ctx.fillRect(splitX - 3, 68, 6, h - 80);
      }

      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });

      // Frame 0 is already alive with the hero headline and raw trace; animate shutter & banner
      tl.fromTo(
        "#s1-hero-inner",

        "#s1-banner",

        { y: 0, opacity: 1, duration: 0.42, ease: "power4.out" },

      tl.fromTo(

          onUpdate: function () {

          },
        },

      );

    })();
  </script>
