<!DOCTYPE html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"hero_freq","type":"string","label":"Sampling Rate","default":"4,000 Hz"},
    {"id":"notch_db","type":"string","label":"50Hz Hum Suppression","default":"-25.5 dB"},
    {"id":"author_name","type":"string","label":"Engineer","default":"ARDHYA NOVRI RAMADHAN, S.T."}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
    <title>SignalProof Lab × ENVIID — Deterministic Engineering Reel</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #11151c;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #bg-plate {
        position: absolute;
        inset: 0;
        background-color: #11151c;
        background-image:
          linear-gradient(rgba(244, 241, 234, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(244, 241, 234, 0.045) 1px, transparent 1px);
        background-size: 36px 36px;
        z-index: 0;
      }
      .scene-host {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-eyc7"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="36"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div data-hf-id="hf-vu6a" id="bg-plate" data-layout-ignore="true"></div>

      <audio data-hf-id="hf-3te3"
        id="bgm-main"
        class="clip"
        src="assets/soundtrack.wav"
        data-start="0"
        data-duration="36"
        data-track-index="0"
        data-volume="0.85"
        data-fade-in="0.25"
        data-fade-out="1.2"
      ></audio>

      <div data-hf-id="hf-cfp9"
        id="scene1"
        class="clip scene-host"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2;"
      ></div>

      <div data-hf-id="hf-r07v"
        id="scene2"
        class="clip scene-host"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2.html"
        data-start="5"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2;"
      ></div>

      <div data-hf-id="hf-m4bs"
        id="scene3"
        class="clip scene-host"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3.html"
        data-start="12"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        data-hold="true"
        style="z-index: 2;"
      ></div>

      <div data-hf-id="hf-g5nv"
        id="scene4"
        class="clip scene-host"
        data-composition-id="scene4"
        data-composition-src="compositions/scene4.html"
        data-start="20"
        data-duration="9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        data-hold="true"
        style="z-index: 2;"
      ></div>

      <div data-hf-id="hf-csxu"
        id="scene5"
        class="clip scene-host"
        data-composition-id="scene5"
        data-composition-src="compositions/scene5.html"
        data-start="29"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2;"
      ></div>

      <div data-hf-id="hf-nnsv"
        id="captions"
        class="clip scene-host"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="36"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 5;"
      ></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
